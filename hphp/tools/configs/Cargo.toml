[package]
name = "generate_configs_lib"
version = "0.0.0"
edition = "2021"

[lib]
path = "generate_configs_lib.rs"

[[bin]]
name = "generate_configs"
path = "generate_configs.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
convert_case = "0.4.0"
nom = "8"
nom-language = "0.1.0"

[build-dependencies]
anyhow = "1.0.86"
cc = "1.0.90"
